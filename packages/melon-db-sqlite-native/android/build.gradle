buildscript {
  ext.kotlin_version = "2.0.21"
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def isNewArchitectureEnabled() {
  return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

def resolveReactNativeDirectory() {
  if (rootProject.ext.has("reactNativeDir")) {
    return rootProject.ext.reactNativeDir
  }
  def candidates = [
    file("${rootProject.projectDir}/../node_modules/react-native"),
    file("${projectDir}/../../node_modules/react-native"),
    file("${projectDir}/../../../node_modules/react-native"),
    file("${projectDir}/../../../../node_modules/react-native"),
  ]
  def found = candidates.find { it.exists() }
  if (found == null) {
    throw new GradleException(
        "Could not find react-native. Set ext.reactNativeDir in the app build.gradle.")
  }
  return found
}

def reactNativeRootDir = resolveReactNativeDirectory()

def toPlatformIndependentPath(File path) {
  def result = path.toString()
  if (org.apache.tools.ant.taskdefs.condition.Os.isFamily(
      org.apache.tools.ant.taskdefs.condition.Os.FAMILY_WINDOWS)) {
    result = result.replace(File.separatorChar, '/' as char)
  }
  return result
}

def resolveSqlite3SrcDir() {
  def localVendor = file("${projectDir}/../vendor/sqlite3")
  if (new File(localVendor, "sqlite3.c").exists()) {
    return localVendor
  }

  def searchRoots = [] as LinkedHashSet
  searchRoots.add(rootProject.projectDir)
  searchRoots.add(rootProject.projectDir.parentFile)
  searchRoots.add(projectDir)
  def cursor = projectDir
  for (int i = 0; i < 8 && cursor != null; i++) {
    searchRoots.add(cursor)
    cursor = cursor.parentFile
  }

  throw new GradleException(
      "Could not find sqlite3 amalgamation at packages/melon-db-sqlite-native/vendor/sqlite3 " +
      "(sqlite3.c + sqlite3.h). Use upstream SQLite amalgamation, not expo-sqlite's renamed build.")
}

def sqlite3SrcDir = resolveSqlite3SrcDir()

def getSqliteBuildFlags() {
  return "-DSQLITE_THREADSAFE=1 -DSQLITE_ENABLE_FTS4=1 -DSQLITE_ENABLE_FTS3_PARENTHESIS=1 -DSQLITE_ENABLE_FTS5=1"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

android {
  compileSdkVersion safeExtGet("compileSdkVersion", 35)
  namespace "com.melon.sqlite"

  buildFeatures {
    buildConfig true
    prefab true
  }

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

    externalNativeBuild {
      cmake {
        cppFlags "-std=c++20", "-frtti", "-fexceptions", "-O2"
        arguments "-DANDROID_STL=c++_shared",
          "-DSQLITE3_SRC_DIR=${toPlatformIndependentPath(sqlite3SrcDir)}",
          "-DSQLITE_BUILDFLAGS=${getSqliteBuildFlags()}"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packaging {
    jniLibs {
      pickFirsts += [
        "**/libc++_shared.so",
        "**/libfbjni.so",
        "**/libjsi.so",
        "**/libreactnative.so",
        "**/libreactnativejni.so",
        "**/libreact_nativemodule_core.so",
        "**/libturbomodulejsijni.so",
      ]
    }
  }

  sourceSets {
    main {
      java.srcDirs = ["src/main/java"]
      if (isNewArchitectureEnabled()) {
        java.srcDirs += ["${project.buildDir}/generated/source/codegen/java"]
      }
    }
  }
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../")
    libraryName = "MelonSQLiteSpec"
    codegenJavaPackageName = "com.melon.sqlite"
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}
