<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-label="Native stack layers">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#64748b"/>
    </marker>
    <style>
      .layer { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .box { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; rx: 6; }
      .title { font: 700 13px Manrope, system-ui, sans-serif; fill: #475569; }
      .label { font: 600 11px Manrope, system-ui, sans-serif; fill: #0f172a; }
    </style>
  </defs>
  <rect class="layer" x="20" y="20" width="780" height="90"/>
  <text class="title" x="40" y="45">JavaScript</text>
  <rect class="box" x="40" y="55" width="150" height="36"/><text class="label" x="55" y="78">@melon/db-sqlite/rn</text>
  <rect class="box" x="210" y="55" width="160" height="36"/><text class="label" x="225" y="78">MelonSQLiteBridge.ts</text>
  <rect class="box" x="390" y="55" width="150" height="36"/><text class="label" x="405" y="78">MelonSQLiteJsi.ts</text>

  <rect class="layer" x="20" y="130" width="780" height="90"/>
  <text class="title" x="40" y="155">TurboModule codegen</text>
  <rect class="box" x="40" y="165" width="180" height="36"/><text class="label" x="55" y="188">NativeMelonSQLite.ts</text>
  <rect class="box" x="240" y="165" width="180" height="36"/><text class="label" x="255" y="188">iOS TurboModule.mm</text>
  <rect class="box" x="440" y="165" width="200" height="36"/><text class="label" x="450" y="188">Android MelonSQLiteModule.kt</text>

  <rect class="layer" x="20" y="240" width="780" height="90"/>
  <text class="title" x="40" y="265">C++ JSI + native DB thread</text>
  <rect class="box" x="40" y="275" width="240" height="36"/><text class="label" x="55" y="298">MelonSQLiteHostObject.cpp</text>
  <rect class="box" x="300" y="275" width="180" height="36"/><text class="label" x="315" y="298">libmelon_sqlite.so / iOS</text>
  <rect class="box" x="500" y="275" width="160" height="36"/><text class="label" x="515" y="298">DB worker queue</text>

  <line x1="115" y1="91" x2="115" y2="130" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="290" y1="91" x2="330" y2="130" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="465" y1="91" x2="160" y2="240" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="330" y1="201" x2="160" y2="240" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="540" y1="201" x2="380" y2="240" stroke="#64748b" marker-end="url(#arrow)"/>
</svg>
