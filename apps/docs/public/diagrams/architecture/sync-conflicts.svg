<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Conflict resolution flow">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#64748b"/>
    </marker>
    <style>
      .node { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; rx: 8; }
      .decision { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
      .label { font: 600 12px Manrope, system-ui, sans-serif; fill: #0f172a; }
      .small { font: 500 11px Manrope, system-ui, sans-serif; fill: #334155; }
    </style>
  </defs>
  <rect class="node" x="240" y="20" width="160" height="40"/><text class="label" x="265" y="45">Remote change</text>
  <polygon class="decision" points="320,90 400,130 320,170 240,130"/><text class="small" x="278" y="128">Local row?</text>
  <rect class="node" x="460" y="110" width="140" height="40"/><text class="label" x="485" y="135">Insert remote</text>
  <polygon class="decision" points="320,200 400,240 320,280 240,240"/><text class="small" x="275" y="238">Outbox?</text>
  <polygon class="decision" points="320,310 400,350 320,390 240,350"/><text class="small" x="268" y="352">Policy?</text>

  <rect class="node" x="40" y="330" width="120" height="36"/><text class="small" x="55" y="352">server-wins</text>
  <rect class="node" x="480" y="300" width="120" height="36"/><text class="small" x="500" y="322">client-wins</text>
  <rect class="node" x="480" y="350" width="120" height="36"/><text class="small" x="488" y="372">merge-by-field</text>
  <rect class="node" x="260" y="400" width="120" height="36"/><text class="small" x="285" y="422">custom</text>

  <line x1="320" y1="60" x2="320" y2="90" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="400" y1="130" x2="530" y2="130" stroke="#64748b" marker-end="url(#arrow)"/><text class="small" x="430" y="122">no</text>
  <line x1="320" y1="170" x2="320" y2="200" stroke="#64748b" marker-end="url(#arrow)"/><text class="small" x="328" y="188">yes</text>
  <line x1="320" y1="280" x2="320" y2="310" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="240" y1="350" x2="160" y2="348" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="400" y1="330" x2="480" y2="318" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="400" y1="360" x2="480" y2="368" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="320" y1="390" x2="320" y2="400" stroke="#64748b" marker-end="url(#arrow)"/>
</svg>
