<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-label="Sync pull push sequence">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#64748b"/>
    </marker>
    <style>
      .actor { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; rx: 6; }
      .msg { font: 500 11px Manrope, system-ui, sans-serif; fill: #334155; }
      .name { font: 600 12px Manrope, system-ui, sans-serif; fill: #0f172a; }
      .line { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4 4; }
    </style>
  </defs>
  <rect class="actor" x="30" y="20" width="80" height="36"/><text class="name" x="52" y="43">App</text>
  <rect class="actor" x="170" y="20" width="100" height="36"/><text class="name" x="185" y="43">@melon/sync</text>
  <rect class="actor" x="330" y="20" width="120" height="36"/><text class="name" x="345" y="43">MelonDatabase</text>
  <rect class="actor" x="510" y="20" width="100" height="36"/><text class="name" x="525" y="43">Backend</text>

  <line class="line" x1="70" y1="56" x2="70" y2="280"/>
  <line class="line" x1="220" y1="56" x2="220" y2="280"/>
  <line class="line" x1="390" y1="56" x2="390" y2="280"/>
  <line class="line" x1="560" y1="56" x2="560" y2="280"/>

  <line x1="70" y1="80" x2="220" y2="80" stroke="#64748b" marker-end="url(#arrow)"/><text class="msg" x="95" y="72">synchronize()</text>
  <line x1="220" y1="110" x2="560" y2="110" stroke="#64748b" marker-end="url(#arrow)"/><text class="msg" x="330" y="102">pullChanges</text>
  <line x1="560" y1="140" x2="220" y2="140" stroke="#64748b" marker-end="url(#arrow)"/><text class="msg" x="330" y="132">changes + timestamp</text>
  <line x1="220" y1="170" x2="390" y2="170" stroke="#64748b" marker-end="url(#arrow)"/><text class="msg" x="260" y="162">applyRemoteChanges</text>
  <line x1="220" y1="200" x2="390" y2="200" stroke="#64748b" marker-end="url(#arrow)"/><text class="msg" x="265" y="192">getLocalChanges</text>
  <line x1="220" y1="230" x2="560" y2="230" stroke="#64748b" marker-end="url(#arrow)"/><text class="msg" x="340" y="222">pushChanges</text>
  <line x1="220" y1="260" x2="390" y2="260" stroke="#64748b" marker-end="url(#arrow)"/><text class="msg" x="255" y="252">markLocalChangesPushed + checkpoint</text>
</svg>
