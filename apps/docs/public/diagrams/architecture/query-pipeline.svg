<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="Query pipeline sequence">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#64748b"/>
    </marker>
    <style>
      .actor { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; rx: 6; }
      .msg { font: 500 11px Manrope, system-ui, sans-serif; fill: #334155; }
      .name { font: 600 12px Manrope, system-ui, sans-serif; fill: #0f172a; }
      .line { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4 4; }
    </style>
  </defs>
  <rect class="actor" x="20" y="20" width="110" height="40"/><text class="name" x="35" y="45">Query author</text>
  <rect class="actor" x="190" y="20" width="110" height="40"/><text class="name" x="200" y="45">Query compiler</text>
  <rect class="actor" x="360" y="20" width="120" height="40"/><text class="name" x="375" y="45">MelonDatabase</text>
  <rect class="actor" x="540" y="20" width="120" height="40"/><text class="name" x="555" y="45">StorageAdapter</text>
  <rect class="actor" x="720" y="20" width="110" height="40"/><text class="name" x="745" y="45">Subscribers</text>

  <line class="line" x1="75" y1="60" x2="75" y2="300"/>
  <line class="line" x1="245" y1="60" x2="245" y2="300"/>
  <line class="line" x1="420" y1="60" x2="420" y2="300"/>
  <line class="line" x1="600" y1="60" x2="600" y2="300"/>
  <line class="line" x1="775" y1="60" x2="775" y2="300"/>

  <line x1="75" y1="90" x2="245" y2="90" stroke="#64748b" marker-end="url(#arrow)"/><text class="msg" x="95" y="82">fluent / Mango / Prisma</text>
  <line x1="245" y1="120" x2="245" y2="120" stroke="#64748b"/><text class="msg" x="255" y="115">compile to QueryAst</text>
  <line x1="245" y1="150" x2="420" y2="150" stroke="#64748b" marker-end="url(#arrow)"/><text class="msg" x="280" y="142">validate + plan + prepare</text>
  <line x1="420" y1="180" x2="600" y2="180" stroke="#64748b" marker-end="url(#arrow)"/><text class="msg" x="455" y="172">PreparedQuery</text>
  <line x1="600" y1="210" x2="600" y2="210" stroke="#64748b"/><text class="msg" x="610" y="205">SQL or in-memory</text>
  <line x1="600" y1="240" x2="420" y2="240" stroke="#64748b" marker-end="url(#arrow)"/><text class="msg" x="470" y="232">rows</text>
  <line x1="420" y1="270" x2="775" y2="270" stroke="#64748b" marker-end="url(#arrow)"/><text class="msg" x="530" y="262">observe on change</text>
</svg>
