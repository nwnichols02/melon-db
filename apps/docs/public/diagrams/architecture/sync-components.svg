<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" role="img" aria-label="Sync components">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#64748b"/>
    </marker>
    <style>
      .box { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; rx: 8; }
      .group { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .label { font: 600 12px Manrope, system-ui, sans-serif; fill: #0f172a; }
      .title { font: 700 13px Manrope, system-ui, sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect class="group" x="20" y="30" width="420" height="200"/>
  <text class="title" x="40" y="58">Client app</text>
  <rect class="box" x="40" y="80" width="170" height="40"/><text class="label" x="55" y="105">MelonDatabase sync</text>
  <rect class="box" x="40" y="140" width="170" height="40"/><text class="label" x="55" y="165">_melon_sync_outbox</text>
  <rect class="box" x="230" y="80" width="180" height="40"/><text class="label" x="245" y="105">@melon/sync</text>
  <rect class="box" x="230" y="140" width="180" height="40"/><text class="label" x="250" y="165">useSync hooks</text>

  <rect class="group" x="480" y="30" width="280" height="200"/>
  <text class="title" x="500" y="58">Backend</text>
  <rect class="box" x="500" y="90" width="220" height="40"/><text class="label" x="515" y="115">@melon/sync-server</text>
  <rect class="box" x="500" y="150" width="220" height="40"/><text class="label" x="520" y="175">PostgresSyncStore</text>

  <line x1="210" y1="100" x2="230" y2="100" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="210" y1="160" x2="230" y2="160" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="410" y1="100" x2="500" y2="110" stroke="#64748b" marker-end="url(#arrow)"/>
  <text class="label" x="420" y="95">pull / push HTTP</text>
</svg>
