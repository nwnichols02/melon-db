<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img" aria-label="Melon system overview">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#64748b"/>
    </marker>
    <style>
      .box { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; rx: 8; }
      .group { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .label { font: 600 13px Manrope, system-ui, sans-serif; fill: #0f172a; }
      .small { font: 500 12px Manrope, system-ui, sans-serif; fill: #334155; }
      .title { font: 700 14px Manrope, system-ui, sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect class="group" x="20" y="20" width="240" height="380"/>
  <text class="title" x="40" y="48">Query authoring</text>
  <rect class="box" x="40" y="70" width="200" height="36"/><text class="small" x="52" y="93">@melon/db-query</text>
  <rect class="box" x="40" y="120" width="200" height="36"/><text class="small" x="52" y="143">@melon/db-query-mango</text>
  <rect class="box" x="40" y="170" width="200" height="36"/><text class="small" x="52" y="193">@melon/db-prisma</text>

  <rect class="group" x="290" y="120" width="220" height="180"/>
  <text class="title" x="310" y="148">@melon/db</text>
  <rect class="box" x="310" y="170" width="180" height="36"/><text class="small" x="322" y="193">QueryAst</text>
  <rect class="box" x="310" y="220" width="180" height="36"/><text class="small" x="322" y="243">MelonDatabase</text>

  <rect class="group" x="540" y="20" width="260" height="380"/>
  <text class="title" x="560" y="48">Adapters</text>
  <rect class="box" x="560" y="70" width="220" height="36"/><text class="small" x="572" y="93">In-memory</text>
  <rect class="box" x="560" y="120" width="220" height="36"/><text class="small" x="572" y="143">Bun / Node / Expo SQLite</text>
  <rect class="box" x="560" y="170" width="220" height="36"/><text class="small" x="572" y="193">@melon/db-sqlite-native JSI</text>

  <line x1="240" y1="88" x2="290" y2="188" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="240" y1="138" x2="290" y2="188" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="240" y1="188" x2="290" y2="188" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="490" y1="238" x2="540" y2="88" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="490" y1="238" x2="540" y2="138" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="490" y1="238" x2="540" y2="188" stroke="#64748b" marker-end="url(#arrow)"/>
