<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" role="img" aria-label="Write boundary state machine">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#64748b"/>
    </marker>
    <style>
      .state { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; rx: 20; }
      .start { fill: #0f172a; }
      .label { font: 600 13px Manrope, system-ui, sans-serif; fill: #0f172a; }
      .edge { font: 500 11px Manrope, system-ui, sans-serif; fill: #475569; }
    </style>
  </defs>
  <circle class="start" cx="40" cy="140" r="8"/>
  <rect class="state" x="100" y="110" width="80" height="60"/><text class="label" x="125" y="145">Idle</text>
  <rect class="state" x="260" y="40" width="100" height="60"/><text class="label" x="280" y="75">Writing</text>
  <rect class="state" x="260" y="180" width="100" height="60"/><text class="label" x="285" y="215">Reading</text>
  <rect class="state" x="420" y="110" width="80" height="60"/><text class="label" x="435" y="145">Idle</text>

  <line x1="48" y1="140" x2="100" y2="140" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="180" y1="125" x2="260" y2="70" stroke="#64748b" marker-end="url(#arrow)"/><text class="edge" x="190" y="88">db.write()</text>
  <line x1="360" y1="70" x2="420" y2="125" stroke="#64748b" marker-end="url(#arrow)"/><text class="edge" x="370" y="88">complete</text>
  <line x1="180" y1="155" x2="260" y2="210" stroke="#64748b" marker-end="url(#arrow)"/><text class="edge" x="185" y="195">db.read / queries</text>
  <line x1="360" y1="210" x2="420" y2="155" stroke="#64748b" marker-end="url(#arrow)"/><text class="edge" x="370" y="195">complete</text>
  <text class="edge" x="270" y="28">No concurrent writers during Writing</text>
</svg>
