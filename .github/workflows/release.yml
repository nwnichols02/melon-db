name: Release

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm dist-tag
        required: true
        default: alpha
      dry_run:
        description: Dry run (pack only, no npm publish)
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # reserved for OIDC trusted publishing later
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck packages
        run: bun run typecheck:packages

      - name: Audit (high/critical)
        run: bun audit --audit-level=high || test "${{ github.event.inputs.dry_run }}" = "true"

      - name: Build packages
        run: bun run build:packages

      - name: Validate exports
        run: bun tooling/release/validate-exports.ts

      - name: Pack smoke
        run: bun run release:smoke

      - name: Ensure npm CLI is current
        if: github.event.inputs.dry_run != 'true'
        run: npm install -g npm@latest && npm --version

      - name: Publish to npm
        if: github.event.inputs.dry_run != 'true'
        env:
          MELON_PUBLISH_AUTH: token
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          bun tooling/release/publish.ts --tag "${{ github.event.inputs.dist_tag }}"
