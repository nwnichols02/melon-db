name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Docs typecheck
        run: bun run --filter docs typecheck

      - name: Build docs
        run: bun run build:docs
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Lint and format
        run: bun run check

  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Benchmark smoke (10k)
        run: bun run packages/melon-db-sqlite/__benchmarks__/insert-query.bench.ts --scale=10k --json

  bench-compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install better-sqlite3 for compare benchmarks (Node 22)
        working-directory: packages/melon-db-sqlite
        run: |
          npm install better-sqlite3@11.8.1 --no-save
          npm rebuild better-sqlite3

      - name: Melon vs WatermelonDB smoke (10k)
        run: bun run bench:compare:ci
        env:
          COMPARE_RUNNER_BIN: node

  postgres-sync:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: melon
          POSTGRES_PASSWORD: melon
          POSTGRES_DB: melon_sync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U melon -d melon_sync"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://melon:melon@localhost:5432/melon_sync
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Postgres sync-server tests
        run: bun test packages/melon-sync-server
